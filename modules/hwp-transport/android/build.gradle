plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hwptransport'
version = '0.1.0'

android {
  namespace "expo.modules.hwptransport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same major as React Native 0.81's HTTP stack. Used by HwpClientFactory for
  // per-instance certificate relaxation (T05 wires requests through it).
  implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
